<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Catalog & Reserve - DLMS</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- STUDENT SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="rounded-2 p-2 brand-icon-38 text-white">
                    <i class="bi bi-mortarboard text-white fs-5"></i>
                </div>
                <div>
                    <div class="fw-bold fs-6">DLMS.EDU</div>
                    <small class="text-muted fs-11">Patron Portal</small>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li class="sidebar-item"><a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i><span>My Dashboard</span></a></li>
                <li class="sidebar-item"><a href="browse-books.html" class="sidebar-link active"><i class="bi bi-search"></i><span>Browse & Reserve</span></a></li>
                <li class="sidebar-item"><a href="my-books.html" class="sidebar-link"><i class="bi bi-book"></i><span>Borrowed Books</span></a></li>
                <li class="sidebar-item"><a href="fines.html" class="sidebar-link"><i class="bi bi-receipt"></i><span>My Fines</span></a></li>
                <li class="sidebar-item"><a href="history.html" class="sidebar-link"><i class="bi bi-clock-history"></i><span>Loan History</span></a></li>
                <li class="sidebar-item"><a href="profile.html" class="sidebar-link"><i class="bi bi-person"></i><span>My Profile</span></a></li>
                <li class="my-3 border-top border-dark"></li>
                <li class="sidebar-item"><a href="../admin/dashboard.html" class="sidebar-link"><i class="bi bi-shield-lock"></i><span>Switch to Admin</span></a></li>
            </ul>

            <div class="sidebar-footer">
                <div class="d-flex align-items-center justify-content-between small">
                    <span class="fs-11">Team: Aman & Jashwanth</span>
                    <a href="../login.html" class="small fw-semibold text-dark btn-logout">Logout</a>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <header class="top-navbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-custom d-lg-none" id="sidebarToggleBtn" title="Toggle navigation sidebar" aria-label="Toggle navigation sidebar"><i class="bi bi-list"></i></button>
                    <div>
                        <h4 class="fw-bold mb-0">Library Catalog Search</h4>
                        <small class="text-muted">Search textbook volumes and place reservations into the FIFO waitlist</small>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-custom rounded-circle p-2 d-flex align-items-center justify-content-center btn-circle-38" id="themeToggleBtn" title="Toggle theme" aria-label="Toggle theme">
                        <i class="bi bi-moon-stars-fill text-dark" id="themeToggleIcon"></i>
                    </button>
                </div>
            </header>

            <!-- Search Bar & Filters -->
            <div class="glass-card p-3 mb-4">
                <div class="row g-3 align-items-center">
                    <div class="col-md-7">
                        <div class="search-input-group w-100">
                            <i class="bi bi-search"></i>
                            <input type="text" id="studentSearchInput" class="form-control" placeholder="Search by Title, Author, Subject, or Shelf Number...">
                        </div>
                    </div>
                    <div class="col-md-5">
                        <select class="form-select" id="studentCatFilter" title="Filter by category" aria-label="Filter by category">
                            <option value="ALL">All Subjects & Categories</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Books Grid -->
            <div class="row g-4" id="studentCatalogGrid">
                <!-- Injected via JS -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initCategories();
            renderCatalog();

            document.getElementById('studentSearchInput').addEventListener('input', renderCatalog);
            document.getElementById('studentCatFilter').addEventListener('change', renderCatalog);
        });

        function initCategories() {
            const stats = db.getStats();
            const select = document.getElementById('studentCatFilter');
            Object.keys(stats.categories).forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = `${cat} (${stats.categories[cat]})`;
                select.appendChild(opt);
            });
        }

        function renderCatalog() {
            const term = document.getElementById('studentSearchInput').value.toLowerCase().trim();
            const cat = document.getElementById('studentCatFilter').value;

            const books = db.getBooks().filter(b => {
                const matchSearch = !term ||
                    b.title.toLowerCase().includes(term) ||
                    b.author.toLowerCase().includes(term) ||
                    b.isbn.toLowerCase().includes(term) ||
                    b.shelfNumber.toLowerCase().includes(term);

                const matchCat = cat === 'ALL' || b.category === cat;
                return matchSearch && matchCat;
            });

            const grid = document.getElementById('studentCatalogGrid');
            if (books.length === 0) {
                grid.innerHTML = `<div class="col-12 empty-state"><p class="text-muted">No books found matching search.</p></div>`;
                return;
            }

            const currentUser = db.getCurrentUser();
            const memberId = currentUser.memberId || 'MEM-2024-001';

            grid.innerHTML = books.map(b => {
                const isOutOfStock = b.availableCopies === 0;
                return `
                    <div class="col-md-6 col-lg-4 col-xl-3">
                        <div class="glass-card h-100 d-flex flex-column card-hover-lift overflow-hidden">
                            <div class="position-relative">
                                <img src="${b.coverUrl}" alt="${b.title}" class="book-card-cover" onerror="this.src='https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80'">
                                <span class="badge ${b.availableCopies > 0 ? 'bg-success' : 'bg-danger'} position-absolute top-0 end-0 m-2 shadow">
                                    ${b.availableCopies > 0 ? b.availableCopies + ' Available' : 'Waitlist Only'}
                                </span>
                            </div>
                            <div class="p-3 d-flex flex-column flex-grow-1">
                                <span class="badge badge-soft-info mb-2 align-self-start fs-11">${b.category}</span>
                                <h6 class="fw-bold text-truncate mb-1" title="${b.title}">${b.title}</h6>
                                <p class="text-muted small text-truncate mb-1">${b.author}</p>
                                <p class="text-muted small mb-3"><i class="bi bi-geo-alt me-1"></i>Shelf: <strong class="font-monospace">${b.shelfNumber}</strong></p>
                                
                                <div class="mt-auto pt-2 border-top">
                                    <button class="btn btn-sm w-100 ${isOutOfStock ? 'btn-outline-custom' : 'btn-primary'} py-2 fw-semibold" onclick="handleReserve('${b.bookId}')" title="${isOutOfStock ? 'Join Waitlist Queue' : 'Reserve Volume'}">
                                        <i class="bi ${isOutOfStock ? 'bi-hourglass-split' : 'bi-bookmark-plus'} me-1"></i>
                                        ${isOutOfStock ? 'Join Waitlist Queue' : 'Reserve Volume'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleReserve(bookId) {
            const user = db.getCurrentUser();
            const memberId = user.memberId || 'MEM-2024-001';

            const res = db.reserveBook(memberId, bookId);
            if (res.success) {
                showToast(`Reserved! You are at priority rank #${res.queuePosition} in the waitlist queue.`, 'success');
            } else {
                alert(res.message);
            }
        }
    </script>
</body>
</html>
