<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Digital Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body style="background-color: #FFFFFF !important; color: #000000 !important;">

    <div class="min-vh-100 d-flex flex-column justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">
                    <!-- Back Link -->
                    <div class="mb-3">
                        <a href="index.html" class="small fw-semibold text-dark">
                            &larr; Back to Homepage
                        </a>
                    </div>

                    <!-- White Card with Crisp Black Border -->
                    <div class="glass-card p-4 p-sm-5 border border-2 border-dark rounded-3">
                        <div class="text-center mb-4">
                            <div class="rounded-2 p-2 d-inline-flex align-items-center justify-content-center mb-2 text-white" style="background: #000000; width: 48px; height: 48px;">
                                <i class="bi bi-book-half text-white fs-3"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Sign In to DLMS</h3>
                            <p class="text-muted small">Academic Library Management Portal</p>
                        </div>

                        <!-- Alert Box -->
                        <div id="loginAlert" class="alert alert-danger py-2 px-3 rounded-2 small d-none align-items-center gap-2 mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                            <span id="loginAlertText"></span>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Username or Email</label>
                                <input type="text" id="usernameInput" class="form-control" placeholder="e.g. admin or aman" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Password</label>
                                <div class="input-group">
                                    <input type="password" id="passwordInput" class="form-control" placeholder="Enter password" required>
                                    <button class="btn btn-outline-custom" type="button" id="togglePasswordBtn">
                                        <i class="bi bi-eye" id="passwordIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex align-items-center justify-content-between mb-4">
                                <div class="form-check">
                                    <input class="form-check-input border-dark" type="checkbox" id="rememberMe" checked>
                                    <label class="form-check-label small" for="rememberMe">Remember session</label>
                                </div>
                                <span class="badge border border-dark small">Secure SHA-256</span>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold fs-6">
                                Sign In &rarr;
                            </button>
                        </form>

                        <!-- Quick 1-Click Demo Credentials -->
                        <div class="mt-4 pt-3 border-top border-dark">
                            <small class="text-muted d-block text-center mb-2 fw-bold text-uppercase">1-Click Demo Evaluation Credentials:</small>
                            <div class="row g-2">
                                <div class="col-6">
                                    <button type="button" class="btn btn-sm btn-outline-custom w-100 py-2" id="quickAdminBtn">
                                        <i class="bi bi-shield-lock me-1"></i> Admin Demo
                                    </button>
                                </div>
                                <div class="col-6">
                                    <button type="button" class="btn btn-sm btn-outline-custom w-100 py-2" id="quickStudentBtn">
                                        <i class="bi bi-mortarboard me-1"></i> Student Demo
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-3 small text-muted">
                        B.Tech PBL Project • Team: Md. Amanuddin & Jashwanth Chowdary
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roleParam = urlParams.get('role');

            if (roleParam === 'ADMIN') {
                document.getElementById('usernameInput').value = 'admin';
                document.getElementById('passwordInput').value = 'admin123';
            } else if (roleParam === 'STUDENT') {
                document.getElementById('usernameInput').value = 'aman';
                document.getElementById('passwordInput').value = 'student123';
            }

            // Toggle password
            document.getElementById('togglePasswordBtn').addEventListener('click', () => {
                const passInput = document.getElementById('passwordInput');
                const icon = document.getElementById('passwordIcon');
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    icon.className = 'bi bi-eye-slash';
                } else {
                    passInput.type = 'password';
                    icon.className = 'bi bi-eye';
                }
            });

            // Quick demo buttons
            document.getElementById('quickAdminBtn').addEventListener('click', () => {
                document.getElementById('usernameInput').value = 'admin';
                document.getElementById('passwordInput').value = 'admin123';
                doLogin('admin', 'admin123');
            });

            document.getElementById('quickStudentBtn').addEventListener('click', () => {
                document.getElementById('usernameInput').value = 'aman';
                document.getElementById('passwordInput').value = 'student123';
                doLogin('aman', 'student123');
            });

            // Form submit
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('usernameInput').value.trim();
                const p = document.getElementById('passwordInput').value.trim();
                doLogin(u, p);
            });
        });

        function doLogin(username, password) {
            const res = db.login(username, password);
            if (res.success) {
                if (res.user.role === 'ADMIN' || res.user.role === 'LIBRARIAN') {
                    window.location.href = 'admin/dashboard.html';
                } else {
                    window.location.href = 'student/dashboard.html';
                }
            } else {
                const alertEl = document.getElementById('loginAlert');
                const textEl = document.getElementById('loginAlertText');
                textEl.textContent = res.message || 'Invalid username or password.';
                alertEl.classList.remove('d-none');
                alertEl.classList.add('d-flex');
            }
        }
    </script>
</body>
</html>
