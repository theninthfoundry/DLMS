# Digital Library Management System (DLMS) Configuration
# Database Connection Settings
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/library_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=root

# Connection Pool / Timing
db.maxPoolSize=20
db.connectionTimeout=5000

# Library Business Rules
library.finePerDay=5.00
library.studentBorrowDays=14
library.facultyBorrowDays=30
library.studentMaxBooks=4
library.facultyMaxBooks=8

# Application Meta
app.name=Digital Library Management System
app.version=1.0.0
app.team=Team: Md. Amanuddin, Jashwanth Chowdary
